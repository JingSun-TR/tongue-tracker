<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Tongue Contour Tracker — 实时舌位轮廓追踪</title>
  <meta name="description" content="Real-time ultrasound tongue contour detection and tracking. Capture ultrasound video via capture card, extract tongue surface contour in real-time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <h1>👅 Real-time Tongue Contour Tracker</h1>
    <div class="header-controls">
      <span id="fps-display" class="fps-badge">0 FPS</span>
      <button id="btn-start" class="btn btn-primary" onclick="startCapture()">▶ 开始采集</button>
      <button id="btn-stop" class="btn" onclick="stopCapture()" disabled>⏹ 停止</button>
      <button class="btn" onclick="takeScreenshot()">📸 截图</button>
      <select id="camera-select" class="select-input" onchange="switchCamera()">
        <option value="">选择摄像头...</option>
      </select>
    </div>
  </div>
</header>

<!-- Main Layout -->
<div class="main-layout">
  
  <!-- Video + Overlay -->
  <div class="video-panel">
    <div class="video-container">
      <video id="source-video" autoplay playsinline muted style="display:none;"></video>
      <canvas id="output-canvas"></canvas>
      <div id="no-signal" class="no-signal">
        <div class="no-signal-icon">📡</div>
        <p>点击「开始采集」连接超声波设备</p>
        <p style="font-size:0.8rem;color:var(--text-muted);">超声波 → 采集卡 → 浏览器摄像头输入</p>
      </div>
    </div>
    
    <!-- Processing Legend -->
    <div class="legend">
      <span class="legend-item"><span class="legend-color" style="background:#00ff88;"></span> 舌面轮廓</span>
      <span class="legend-item"><span class="legend-color" style="background:#ff6b6b;"></span> 轮廓点</span>
      <span class="legend-item"><span class="legend-color" style="background:rgba(255,255,255,0.3);"></span> ROI区域</span>
    </div>
  </div>

  <!-- Controls Panel -->
  <div class="controls-panel">
    <h3>🎛 图像处理参数</h3>
    
    <div class="control-group">
      <label>ROI 区域 (Y起点 %)</label>
      <div class="range-row">
        <input type="range" id="roi-y" min="0" max="80" value="30" oninput="updateParam('roiY', this.value)">
        <span class="range-val" id="roi-y-val">30%</span>
      </div>
    </div>

    <div class="control-group">
      <label>ROI 区域 (Y终点 %)</label>
      <div class="range-row">
        <input type="range" id="roi-h" min="20" max="100" value="80" oninput="updateParam('roiH', this.value)">
        <span class="range-val" id="roi-h-val">80%</span>
      </div>
    </div>

    <div class="control-group">
      <label>高斯模糊</label>
      <div class="range-row">
        <input type="range" id="blur" min="1" max="15" value="5" step="2" oninput="updateParam('blur', this.value)">
        <span class="range-val" id="blur-val">5</span>
      </div>
    </div>

    <div class="control-group">
      <label>二值化阈值</label>
      <div class="range-row">
        <input type="range" id="threshold" min="30" max="200" value="100" oninput="updateParam('threshold', this.value)">
        <span class="range-val" id="threshold-val">100</span>
      </div>
    </div>

    <div class="control-group">
      <label>边缘检测灵敏度</label>
      <div class="range-row">
        <input type="range" id="edge-low" min="10" max="150" value="50" oninput="updateParam('edgeLow', this.value)">
        <span class="range-val" id="edge-low-val">50</span>
      </div>
      <div class="range-row">
        <input type="range" id="edge-high" min="50" max="250" value="150" oninput="updateParam('edgeHigh', this.value)">
        <span class="range-val" id="edge-high-val">150</span>
      </div>
    </div>

    <div class="control-group">
      <label>轮廓线粗细</label>
      <div class="range-row">
        <input type="range" id="line-width" min="1" max="6" value="3" oninput="updateParam('lineWidth', this.value)">
        <span class="range-val" id="line-width-val">3</span>
      </div>
    </div>

    <div class="control-group">
      <label>
        <input type="checkbox" id="show-points" checked onchange="updateCheckbox('showPoints', this.checked)">
        显示轮廓点
      </label>
    </div>

    <div class="control-group">
      <label>
        <input type="checkbox" id="show-roi" checked onchange="updateCheckbox('showROI', this.checked)">
        显示ROI区域
      </label>
    </div>

    <div class="control-group">
      <label>
        <input type="checkbox" id="invert" onchange="updateCheckbox('invert', this.checked)">
        反转图像（暗底超声图）
      </label>
    </div>

    <button class="btn btn-block" onclick="resetParams()" style="margin-top:8px;">🔄 恢复默认</button>

    <div class="info-box" style="margin-top:16px;">
      <h4>💡 使用说明</h4>
      <ol style="font-size:0.78rem;color:var(--text-secondary);padding-left:16px;line-height:1.7;">
        <li>超声波机器通过采集卡连接电脑</li>
        <li>浏览器识别为摄像头输入</li>
        <li>调整ROI到舌头成像区域</li>
        <li>调整阈值直到轮廓清晰</li>
        <li>可调节参数优化轮廓提取</li>
      </ol>
    </div>
  </div>
</div>

<!-- Screenshot Gallery -->
<div class="gallery" id="gallery" style="display:none;">
  <h3>📸 截图 <button class="btn btn-sm" onclick="clearGallery()">清空</button></h3>
  <div class="gallery-grid" id="gallery-grid"></div>
</div>

<script src="app.js"></script>
</body>
</html>
